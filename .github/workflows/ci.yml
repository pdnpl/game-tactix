name: ci

on:
  pull_request:
  push:
    branches: [main]

# A superseded run on the same branch has nothing left to prove.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Types
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Capacitor 8's Android libraries are compiled with source release 21.
      # Java 17 fails at :capacitor-android:compileDebugJavaWithJavac with
      # "invalid source release: 21".
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci

      - name: Sync web build into the Android project
        run: npm run sync

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # Downloadable from the run page — installable on a device for testing.
      - uses: actions/upload-artifact@v4
        with:
          name: tactix-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    # The only way this project's iOS target gets compiled: it cannot be built
    # on the Windows machine the app is developed on.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Sync web build into the iOS project
        run: npm run sync

      # Capacitor 8 uses Swift Package Manager, not CocoaPods — there is no
      # Podfile and no .xcworkspace, so this builds the project directly and
      # lets Xcode resolve the local packages.
      #
      # Simulator build, so no signing certificate or provisioning profile is
      # needed. This proves the project compiles and links; it does not produce
      # a distributable archive.
      - name: Build for simulator
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
